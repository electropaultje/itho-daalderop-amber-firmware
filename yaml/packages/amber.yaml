sensor:
  # Readonly parameters
  - platform: modbus_controller
    name: SG increase setpoint heating
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    address: 340
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid
  - platform: modbus_controller
    name: SG increase setpoint domestic hot water
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    address: 375
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid
  - platform: modbus_controller
    name: SG decrease setpoint cooling
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    address: 376
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid

  # Realtime sensors
  - platform: modbus_controller
    name: Software version
    id: software_version
    address: 501
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Database version
    id: database_version
    address: 502
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: EEPROM version
    id: eeprom_version
    address: 503
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Software version outdoor unit
    id: sofware_version_outdoor_unit
    address: 504
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Heat exchanger water outlet temperature
    id: heat_exchanger_water_outlet_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 505
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
    on_value:
      then:
        - sensor.template.publish:
            id: heat_exchanger_delta_t
            state: !lambda |-
              return x - id(heat_exchanger_water_inlet_temperature).state;
  - platform: modbus_controller
    name: Heat exchanger water inlet temperature
    id: heat_exchanger_water_inlet_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 506
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Indoor coil temperature
    id: indoor_coil_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 507
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Domestic hot water temperature
    id: domestic_hot_water_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 508
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: domestic_hot_water
  - platform: modbus_controller
    name: Heating/cooling temperature
    id: heating_cooling_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 509
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating/cooling circuit 1 temperature
    id: heating_cooling_circuit_1_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 510
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating/cooling circuit 2 temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 511
    register_type: holding
    value_type: S_WORD
    register_count: 4
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Compressor working speed
    device_class: frequency
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: Hz
    address: 515
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Expansion valve setting
    state_class: measurement
    icon: mdi:pipe-valve
    address: 516
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Ambient temperature
    id: ambient_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 517
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
    on_raw_value:
      - script.execute:
          id: blink_light
          calling_component: Modbus
  - platform: modbus_controller
    name: Average 1h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 518
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Average 4h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 519
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Average 24h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 520
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: High pressure
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: bar
    address: 521
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Low pressure
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: bar
    address: 522
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Discharge temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 523
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Suction temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 524
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Outdoor coil temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 525
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Fan speed
    device_class: frequency
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: rpm
    icon: mdi:fan
    address: 526
    register_type: holding
    value_type: S_WORD
    register_count: 2
  - platform: modbus_controller
    name: Running current
    device_class: current
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: A
    address: 528
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Supply voltage
    device_class: voltage
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: V
    address: 529
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Inside temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 531
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
  - platform: template
    name: Heat exchanger delta T
    id: heat_exchanger_delta_t
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: K
    icon: mdi:delta
  - platform: modbus_controller
    name: Actual setpoint heating zone 1
    id: actual_setpoint_heating_zone_1
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    address: 703
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Actual setpoint heating zone 2
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
