binary_sensor:
  # Readonly parameters
  - platform: modbus_controller
    name: SG ready
    register_type: holding
    address: 339
    icon: mdi:transmission-tower
    bitmask: 0x1
    web_server:
      sorting_group_id: smart_grid

  # Realtime sensors
  - platform: modbus_controller
    name: Domestic hot water in progress
    icon: mdi:water-boiler
    register_type: holding
    address: 499
    bitmask: 0x8
    web_server:
      sorting_group_id: domestic_hot_water
  - platform: modbus_controller
    name: Heating in progress
    icon: mdi:fire
    register_type: holding
    address: 499
    bitmask: 0x10
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Cooling in progress
    icon: mdi:snowflake
    register_type: holding
    address: 499
    bitmask: 0x20
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Defrost
    icon: mdi:snowflake-alert
    register_type: holding
    address: 530
    bitmask: 0x1
    force_new_range: true
  - platform: modbus_controller
    name: Water flow switch
    icon: mdi:waves
    register_type: holding
    address: 532
    bitmask: 0x1
  - platform: modbus_controller
    name: Cooling switch
    icon: mdi:snowflake
    register_type: holding
    address: 534
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating switch
    icon: mdi:fire
    register_type: holding
    address: 535
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating switch circuit 2
    icon: mdi:fire
    register_type: holding
    address: 536
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling

  # Fault codes
  - platform: modbus_controller
    name: P01 - Main line current protection
    register_type: holding
    address: 540
    bitmask: 0x0001
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P02 - Compressor phase current protection
    register_type: holding
    address: 540
    bitmask: 0x0002
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P03 - IPM module protection
    register_type: holding
    address: 540
    bitmask: 0x0004
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P04 - Compressor oil return protection
    register_type: holding
    address: 540
    bitmask: 0x0008
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P05 - Compressor shut down due to abnormal high/low pressure
    register_type: holding
    address: 540
    bitmask: 0x0010
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P06 - Compressor speed down due to abnormal high pressure
    register_type: holding
    address: 540
    bitmask: 0x0020
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P07 - Compressor preheating
    register_type: holding
    address: 540
    bitmask: 0x0040
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P08 - Compressor discharge temp. too high protection
    register_type: holding
    address: 540
    bitmask: 0x0080
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P09 - Outdoor evaporator coil temp. protection
    register_type: holding
    address: 540
    bitmask: 0x0100
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P10 - AC over high/low voltage protection
    register_type: holding
    address: 540
    bitmask: 0x0200
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P11 - Compressor shut down due to too high/low outdoor temperature
    register_type: holding
    address: 540
    bitmask: 0x0400
