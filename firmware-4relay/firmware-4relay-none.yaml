select:
  - platform: modbus_controller
    name: Working mode
    address: 3
    value_type: S_WORD
    optionsmap:
      Heating: 1
      Cooling: 2
      Domestic hot water: 3
      Auto: 4
    icon: mdi:cog-outline
    register_count: 2
  - platform: modbus_controller
    name: Pump speed heating
    address: 214
    value_type: S_WORD
    optionsmap:
      High: 0
      Medium: 1
      Low: 2
    icon: mdi:pump
  - platform: modbus_controller
    name: Pump speed cooling
    address: 215
    value_type: S_WORD
    optionsmap:
      High: 0
      Medium: 1
      Low: 2
    icon: mdi:pump
  - platform: modbus_controller
    name: Pump speed domestic hot water
    address: 216
    value_type: S_WORD
    optionsmap:
      High: 0
      Medium: 1
      Low: 2
    icon: mdi:pump

  - platform: template
    name: Yellow LED Status
    id: yellow_led_select
    optimistic: true
    restore_value: true
    entity_category: config
    options:
      - "Off"
      - Modbus
      - Pulse
      - Relais 1
      - Relais 2
      - Relais 3
      - Relais 4

script:
  - id: relay_light
    parameters:
      calling_component: string
      relais_state: bool
    then:
      - if:
          condition:
            lambda: return id(yellow_led_select).state == calling_component;
          then:
            - light.control:
                id: led_yellow
                state: !lambda return relais_state;
  - id: blink_light
    parameters:
      calling_component: string
    then:
      - if:
          condition:
            lambda: return id(yellow_led_select).state == calling_component;
          then:
            - light.turn_on: led_yellow
            - delay: 250ms
            - light.turn_off: led_yellow

text_sensor:
  - platform: wifi_info
    mac_address:
      id: mac_address

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: fault_codes
      name: Fault codes
      sorting_weight: 100
    - id: relays
      name: Relays
      sorting_weight: 4
    - id: heating_cooling
      name: Heating/Cooling
      sorting_weight: 1
    - id: smart_grid
      name: Smart Grid
      sorting_weight: 3
    - id: domestic_hot_water
      name: Domestic Hot Water
      sorting_weight: 2