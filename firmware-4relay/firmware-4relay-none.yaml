substitutions:
  device_name: ithodaalderop-amber
  friendly_name: Itho Daalderop Amber Heat Pump Control Module
  version: 1.7.1

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  project:
    name: electropaultje.ithodaalderopAMBER
    version: ${version}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  platform: esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: IthoDaalderop
    password: ithodaalderop

captive_portal:

status_led:
  pin:
    number: GPIO19


uart:
  baud_rate: 19200
  rx_pin: GPIO32
  tx_pin: GPIO33
  parity: NONE

modbus:
  flow_control_pin: GPIO14
  send_wait_time: 1000ms  

modbus_controller:
  - id: modbus_con
    address: 0x01
    update_interval: 15s
    offline_skip_updates : 0

output:
  - platform: gpio
    id: led_yellow_output
    pin: GPIO18

light:
  - platform: binary
    id: led_yellow
    output: led_yellow_output

one_wire:
  - platform: gpio
    pin: GPIO27

sensor:
  # Readonly parameters
  - platform: modbus_controller
    name: SG increase setpoint heating
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C    
    address: 340
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid
  - platform: modbus_controller
    name: SG increase setpoint domestic hot water
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 375
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid
  - platform: modbus_controller
    name: SG decrease setpoint cooling
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 376
    register_type: holding
    value_type: S_WORD
    web_server:
      sorting_group_id: smart_grid

  # Realtime sensors
  - platform: modbus_controller
    name: Software version
    id: software_version
    address: 501
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Database version
    id: database_version
    address: 502
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: EEPROM version
    id: eeprom_version
    address: 503
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Software version outdoor unit
    id: sofware_version_outdoor_unit
    address: 504
    register_type: holding
    value_type: S_WORD
    icon: mdi:database-outline
    entity_category: diagnostic
  - platform: modbus_controller
    name: Heat exchanger water outlet temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 505
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
    on_value:
      then:
        - sensor.template.publish:
            id: heat_exchanger_delta_t
            state: !lambda |-
              return x - id(heat_exchanger_water_inlet_temperature).state;
  - platform: modbus_controller
    name: Heat exchanger water inlet temperature
    id: heat_exchanger_water_inlet_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 506
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Indoor coil temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 507
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Domestic hot water temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 508
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: domestic_hot_water
  - platform: modbus_controller
    name: Heating/cooling temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 509
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating/cooling circuit 1 temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 510
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling      
  - platform: modbus_controller
    name: Heating/cooling circuit 2 temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 511
    register_type: holding
    value_type: S_WORD
    register_count: 4
    filters:
      - multiply: 0.1
      - filter_out: -99
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Compressor working speed
    device_class: frequency
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: Hz
    address: 515
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Expansion valve setting
    state_class: measurement
    icon: mdi:pipe-valve
    address: 516
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Ambient temperature
    id: ambient_temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 517
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
    on_raw_value:
      - script.execute:
          id: blink_light
          calling_component: Modbus
  - platform: modbus_controller
    name: Average 1h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 518
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Average 4h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 519
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Average 24h ambient temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 520
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: High pressure
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: bar
    address: 521
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Low pressure
    device_class: pressure
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: bar
    address: 522
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Discharge temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 523
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Suction temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 524
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Outdoor coil temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 525
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Fan speed
    device_class: frequency
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: rpm
    icon: mdi:fan
    address: 526
    register_type: holding
    value_type: S_WORD
    register_count: 2
  - platform: modbus_controller
    name: Running current
    device_class: current
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: A
    address: 528
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    name: Supply voltage
    device_class: voltage
    accuracy_decimals: 0
    state_class: measurement
    unit_of_measurement: V
    address: 529
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: Inside temperature
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: °C
    icon: mdi:thermometer
    address: 531
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1
      - filter_out: -99
  - platform: template
    name: Heat exchanger delta T
    id: heat_exchanger_delta_t
    device_class: temperature
    accuracy_decimals: 1
    state_class: measurement
    unit_of_measurement: K
    icon: mdi:delta

  - platform: modbus_controller
    name: Actual setpoint heating zone 1
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 703
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1  
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Actual setpoint heating zone 2
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 704
    register_type: holding
    value_type: S_WORD    
    register_count: 10
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Actual setpoint cooling zone 1
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 714
    register_type: holding
    value_type: S_WORD
    filters:
      - multiply: 0.1  
    web_server:
      sorting_group_id: heating_cooling      
  - platform: modbus_controller
    name: Actual setpoint cooling zone 2
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C       
    address: 715
    register_type: holding
    value_type: S_WORD    
    filters:
      - multiply: 0.1
    web_server:
      sorting_group_id: heating_cooling

  - platform: uptime
    id: sensor_uptime

  - platform: template
    id: sensor_uptime_timestamp
    name: Uptime
    device_class: timestamp
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      static float timestamp = (
        id(time_homeassistant).utcnow().timestamp - id(sensor_uptime).state
      );
      return timestamp;

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: WiFi signal dB
    id: wifi_signal_db
    update_interval: 20s

  - platform: pulse_counter
    pin: GPIO35
    name: Pulse meter
    unit_of_measurement: l/hr
    filters:
      - lambda: return x / id(flow_sensor_calibration).state * 60;
      - delta: 1
    total:
      name: Total pulses
      unit_of_measurement: l
      filters:
        - lambda: return x / id(flow_sensor_calibration).state;
        - delta: 1
    on_value:
      - script.execute:
          id: blink_light
          calling_component: Pulse

  - platform: dallas_temp
    name: Dallas temperature 1
    icon: mdi:thermometer
    index: 0
    update_interval: 15s
    filters:
      - lambda: return x + id(dallas_1_offset).state;
      - delta: 0.1
  - platform: dallas_temp
    name: Dallas temperature 2
    icon: mdi:thermometer
    index: 1
    update_interval: 15s
    filters:
      - lambda: return x + id(dallas_2_offset).state;
      - delta: 0.1
  - platform: dallas_temp
    name: Dallas temperature 3
    icon: mdi:thermometer
    index: 2
    update_interval: 15s
    filters:
      - lambda: return x + id(dallas_3_offset).state;
      - delta: 0.1

binary_sensor:
  # Readonly parameters
  - platform: modbus_controller
    name: SG ready
    register_type: holding
    address: 339
    icon: mdi:transmission-tower
    bitmask: 0x1
    web_server:
      sorting_group_id: smart_grid

  # Realtime sensors
  - platform: modbus_controller
    name: Domestic hot water in progress
    icon: mdi:water-boiler
    register_type: holding
    address: 499
    bitmask: 0x8
    web_server:
      sorting_group_id: domestic_hot_water
  - platform: modbus_controller
    name: Heating in progress
    icon: mdi:fire
    register_type: holding
    address: 499
    bitmask: 0x10
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Cooling in progress
    icon: mdi:snowflake
    register_type: holding
    address: 499
    bitmask: 0x20
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Defrost
    icon: mdi:snowflake-alert
    register_type: holding
    address: 530
    bitmask: 0x1
    force_new_range: true
  - platform: modbus_controller
    name: Water flow switch
    icon: mdi:waves
    register_type: holding
    address: 532
    bitmask: 0x1
  - platform: modbus_controller
    name: Cooling switch
    icon: mdi:snowflake
    register_type: holding
    address: 534
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating switch
    icon: mdi:fire
    register_type: holding
    address: 535
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling
  - platform: modbus_controller
    name: Heating switch circuit 2
    icon: mdi:fire
    register_type: holding
    address: 536
    bitmask: 0x1
    web_server:
      sorting_group_id: heating_cooling

  # Fault codes
  - platform: modbus_controller
    name: P01 - Main line current protection
    register_type: holding
    address: 540
    bitmask: 0x0001
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P02 - Compressor phase current protection
    register_type: holding
    address: 540
    bitmask: 0x0002
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P03 - IPM module protection
    register_type: holding
    address: 540
    bitmask: 0x0004
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P04 - Compressor oil return protection
    register_type: holding
    address: 540
    bitmask: 0x0008
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P05 - Compressor shut down due to abnormal high/low pressure
    register_type: holding
    address: 540
    bitmask: 0x0010
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P06 - Compressor speed down due to abnormal high pressure
    register_type: holding
    address: 540
    bitmask: 0x0020
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P07 - Compressor preheating
    register_type: holding
    address: 540
    bitmask: 0x0040
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P08 - Compressor discharge temp. too high protection
    register_type: holding
    address: 540
    bitmask: 0x0080
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P09 - Outdoor evaporator coil temp. protection
    register_type: holding
    address: 540
    bitmask: 0x0100
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P10 - AC over high/low voltage protection
    register_type: holding
    address: 540
    bitmask: 0x0200
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P11 - Compressor shut down due to too high/low outdoor temperature
    register_type: holding
    address: 540
    bitmask: 0x0400
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P12 - Frequency limit compressor
    register_type: holding
    address: 540
    bitmask: 0x0800
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: P13 - Low pressure condensor pressure switch
    register_type: holding
    address: 540
    bitmask: 0x1000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F01 - Outdoor temp. sensor failure (Ta)
    register_type: holding
    address: 541
    bitmask: 0x0020
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F02 - Outdoor evaporator coil temp. sensor failure (Tp)
    register_type: holding
    address: 541
    bitmask: 0x0040
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F03 - Outdoor gas discharge temp. sensor failure (Td)
    register_type: holding
    address: 541
    bitmask: 0x0080
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F04 - Outdoor gas return temp. sensor failure (Ts)
    register_type: holding
    address: 541
    bitmask: 0x0100
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F05 - Evaporator pressure sensor failure (Ps)
    register_type: holding
    address: 541
    bitmask: 0x0200
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F06 - Condenser pressure sensor failure (Pd)
    register_type: holding
    address: 541
    bitmask: 0x0400
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F07 - Pressure switch failure
    register_type: holding
    address: 541
    bitmask: 0x0800
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F09 - DC fan A failure
    register_type: holding
    address: 541
    bitmask: 0x2000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F10 - DC fan B failure
    register_type: holding
    address: 541
    bitmask: 0x4000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F11 - Evaporating pressure failure
    register_type: holding
    address: 541
    bitmask: 0x8000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F12 - high pressure failure (Pd)
    register_type: holding
    address: 542
    bitmask: 0x0001
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F13 - Room temperature sensor failure (Tr)
    register_type: holding
    address: 542
    bitmask: 0x0002
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F14 - Sanitary hot water temperature sensor failure (Tw)
    register_type: holding
    address: 542
    bitmask: 0x0004
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F15 - Cooling/heating water temperature sensor failure (Tc)
    register_type: holding
    address: 542
    bitmask: 0x0008
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F16 - Water outlet temperature sensor failure (Tuo)
    register_type: holding
    address: 542
    bitmask: 0x0010
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F17 - Water inlet temperature sensor failure (Tui)
    register_type: holding
    address: 542
    bitmask: 0x0020
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F18 - Condenser coil temp. sensor failure (Tup)
    register_type: holding
    address: 542
    bitmask: 0x0040
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F21 - Mixing valve 1 temperature sensor failure (Tv1)
    register_type: holding
    address: 542
    bitmask: 0x0080
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F22 - Mixing valve 2 temperature sensor failure (Tv2)
    register_type: holding
    address: 542
    bitmask: 0x0100
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F25 - Communication failure to indoor controller
    register_type: holding
    address: 542
    bitmask: 0x0200
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F27 - Indoor PCB EEPROM failure
    register_type: holding
    address: 542
    bitmask: 0x0400
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F28 - Water pump PWM signal feedback failure P0
    register_type: holding
    address: 542
    bitmask: 0x0800
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F29 - Mixing valve 1 failure
    register_type: holding
    address: 542
    bitmask: 0x1000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: F30 - Mixing valve 2 failure
    register_type: holding
    address: 542
    bitmask: 0x2000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: E01 - Communication failure
    register_type: holding
    address: 540
    bitmask: 0x2000
    device_class: problem
    web_server:
      sorting_group_id: fault_codes
  - platform: modbus_controller
    name: E02 - Communication failure
